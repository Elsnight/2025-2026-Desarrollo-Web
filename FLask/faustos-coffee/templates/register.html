{% extends "base.html" %}

{% block title %}Registro | Faustos Coffee{% endblock %}

{% block content %}
<section class="row justify-content-center">
    <div class="col-lg-7 col-xl-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <span class="section-label">Fase 7</span>
                <h1 class="h2 fw-bold mb-3">Crear cuenta</h1>
                <p class="text-muted mb-4">
                    Registra un usuario para iniciar sesion y acceder a las rutas protegidas de administracion.
                </p>

                <form method="post" class="row g-3">
                    <input type="hidden" name="next" value="{{ next_url }}">

                    <div class="col-12">
                        <label class="form-label" for="nombre">Nombre completo</label>
                        <input class="form-control" id="nombre" name="nombre" required value="{{ request.form.get('nombre', '') }}">
                    </div>

                    <div class="col-12">
                        <label class="form-label" for="email">Correo electronico</label>
                        <input
                            class="form-control"
                            id="email"
                            name="email"
                            required
                            type="email"
                            value="{{ request.form.get('email', '') }}"
                        >
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="password">Contrasena</label>
                        <input class="form-control" id="password" name="password" minlength="6" required type="password">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="confirm_password">Confirmar contrasena</label>
                        <input
                            class="form-control"
                            id="confirm_password"
                            name="confirm_password"
                            minlength="6"
                            required
                            type="password"
                        >
                    </div>

                    <div class="col-12 d-grid">
                        <button class="btn btn-coffee" type="submit">Registrarme</button>
                    </div>
                </form>

                <p class="text-muted mb-0 mt-4">
                    Ya tienes cuenta?
                    <a href="{{ url_for('login', next=next_url) }}">Inicia sesion aqui</a>.
                </p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
