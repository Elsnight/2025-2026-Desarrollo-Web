{% extends "base.html" %}

{% block title %}Iniciar sesion | Faustos Coffee{% endblock %}

{% block content %}
<section class="row justify-content-center">
    <div class="col-lg-6 col-xl-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <span class="section-label">Fase 7</span>
                <h1 class="h2 fw-bold mb-3">Iniciar sesion</h1>
                <p class="text-muted mb-4">
                    Accede para administrar productos y proteger las rutas privadas del proyecto con Flask-Login.
                </p>

                <form method="post" class="row g-3">
                    <input type="hidden" name="next" value="{{ next_url }}">

                    <div class="col-12">
                        <label class="form-label" for="email">Correo electronico</label>
                        <input
                            class="form-control"
                            id="email"
                            name="email"
                            required
                            type="email"
                            value="{{ request.form.get('email', '') }}"
                        >
                    </div>

                    <div class="col-12">
                        <label class="form-label" for="password">Contrasena</label>
                        <input class="form-control" id="password" name="password" required type="password">
                    </div>

                    <div class="col-12 d-grid">
                        <button class="btn btn-coffee" type="submit">Entrar</button>
                    </div>
                </form>

                <p class="text-muted mb-0 mt-4">
                    Aun no tienes cuenta?
                    <a href="{{ url_for('register', next=next_url) }}">Registrate aqui</a>.
                </p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
